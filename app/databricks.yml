bundle:
  name: lobbying-experience-search

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID

resources:
  apps:
    app:
      name: "lobbying-experience-search"
      description: "Search lobbying engagements by issue, client and team"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # Uncomment to enable on behalf of user API scopes. Available scopes: sql, genie, files, model-serving
      # user_api_scopes:
      #   - sql

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE

targets:
  default:
    default: true
    workspace:
      host: https://dbc-48fb6798-8ab0.cloud.databricks.com

    variables:
      sql_warehouse_id: 1697fe0db8b76c77
